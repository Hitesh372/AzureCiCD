name: Playwright Tests

on:

  push:

    branches: [ main, master ]

  pull_request:

    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Validate Azure Playwright config
        run: |
          if [ -z "$PLAYWRIGHT_SERVICE_URL" ]; then
            echo "PLAYWRIGHT_SERVICE_URL is not set. Add it as a repository variable." >&2
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_SECRETS }}

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.service.config.js --workers=4

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
